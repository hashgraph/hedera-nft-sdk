name: PR Checks
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Node v${{ matrix.node-version }} Tests
    runs-on: nft-accelerators-linux-medium
    strategy:
      matrix:
        node-version: [ 18, 20 ]
    steps:
      - name: Prepare Runner
        uses: pandaswhocode/initialize-github-job@ed4a98646fe0235e6ecf3af5414b355d2abe3bf3 # v1.0.3
        with:
          checkout: 'true'
          checkout-ref: '${{ github.ref }}'
          checkout-fetch-depth: '0'
          checkout-token: '${{ secrets.GITHUB_TOKEN }}'
          setup-node: 'true'
          node-version: '${{ matrix.node-version }}'

      - name: Install packages
        run: npm ci

      - name: Run Jest Tests
        run: npm run test

      - name: Publish Test Report
        uses: step-security/publish-unit-test-result-action@cc82caac074385ae176d39d2d143ad05e1130b2d # v2.18.0
        if: ${{ !cancelled() }}
        with:
          check_name: Jest Node ${{ matrix.node-version }} Test Results
          check_run: false
          json_thousands_separator: ","
          junit_files: "**/junit*.xml"
